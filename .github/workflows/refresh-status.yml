name: Refresh georeferencing status

on:
  schedule:
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm run fetch

      - name: Commit status.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/status.json; then
            echo "No changes to data/status.json"
            exit 0
          fi
          git add data/status.json
          git commit -m "Refresh georeferencing status"
          git push
