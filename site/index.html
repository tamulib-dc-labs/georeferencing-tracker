<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Georeferencing tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Work+Sans:ital,wght@0,400;0,600;0,700;1,600&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Georeferencing tracker</h1>
    <p id="generatedAt" class="meta"></p>
    <div class="controls">
      <label class="file-label">Load data:
        <input type="file" id="fileInput" accept="application/json" />
      </label>
      <button id="loadDefault" class="primary-button-alt">Load data/status.json</button>
      <button id="downloadBtn">Download edited JSON</button>
      <select id="filter">
        <option value="all">All canvases</option>
        <option value="done">Done (georeferenced)</option>
        <option value="todo">Todo (has map, not georeferenced)</option>
        <option value="not-applicable">Not a map</option>
        <option value="unreviewed">Unreviewed</option>
      </select>
    </div>
    <div id="summary" class="summary"></div>
  </div>
</header>
<main id="app"></main>
<script src="app.js"></script>
</body>
</html>
